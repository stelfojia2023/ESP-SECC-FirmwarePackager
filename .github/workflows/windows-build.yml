name: Windows build and core validation
on:
  push:
    branches: ['main', 'ui/warm-cards-v0.0.1']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select tests from the effective diff
        id: scope
        shell: powershell
        run: |
          python .github/scripts/select_tests.py
          if ($LASTEXITCODE) { throw 'Test selection failed' }
      - name: Documentation and selection safeguards
        shell: powershell
        run: |
          python tests/check_docs.py
          if ($LASTEXITCODE) { throw 'Documentation links failed' }
          python tests/test_check_docs.py
          if ($LASTEXITCODE) { throw 'Documentation checker tests failed' }
          python tests/test_select_tests.py
          if ($LASTEXITCODE) { throw 'Test selection safeguards failed' }
          python tests/check_version.py
          if ($LASTEXITCODE) { throw 'PR version or version consistency check failed' }
          python tests/test_check_version.py
          if ($LASTEXITCODE) { throw 'Version checker tests failed' }
          python tests/check_release_ready.py
          if ($LASTEXITCODE) { throw 'Release metadata check failed' }
          python tests/test_check_release_ready.py
          if ($LASTEXITCODE) { throw 'Release metadata checker tests failed' }
      - name: Run selected tests
        if: steps.scope.outputs.groups != ''
        shell: powershell
        env:
          SELECTED_TEST_GROUPS: ${{ steps.scope.outputs.groups }}
          BUILT_EXE: ${{ steps.scope.outputs.build }}
        run: |
          $evidenceDir = Join-Path $PWD 'evidence/ci'
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          ./tests/run-selected.ps1 -Groups $env:SELECTED_TEST_GROUPS -EvidenceDirectory $evidenceDir
          if ($env:BUILT_EXE -eq 'true') {
            Get-FileHash dist/FirmwarePackager.exe | Format-List | Out-File (Join-Path $evidenceDir 'SHA256.txt')
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.scope.outputs.build == 'true'
        with:
          name: FirmwarePackager-Windows-validation
          path: |
            dist/FirmwarePackager.exe
            evidence/ci/
          retention-days: 30
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 .github/scripts/publish_release.py

